name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Detect Android Project and Gradle Wrapper
        id: detect-project
        run: |
          echo "Searching for Android project root..."
          # Search for setting.gradle or settings.gradle.kts up to 3 levels deep
          ROOT_DIR=""
          for dir in . android android-app *; do
            if [ -f "$dir/settings.gradle.kts" ] || [ -f "$dir/settings.gradle" ]; then
              ROOT_DIR="$dir"
              break
            fi
          done

          if [ -z "$ROOT_DIR" ]; then
            echo "::error::Android project root could not be found!"
            exit 1
          fi

          echo "Detected Android project root: $ROOT_DIR"
          echo "project_root=$ROOT_DIR" >> $GITHUB_OUTPUT

          # Verify Gradle wrapper exists
          if [ ! -f "$ROOT_DIR/gradlew" ]; then
            echo "::error::Gradle wrapper (gradlew) not found in $ROOT_DIR!"
            exit 1
          fi

          # Detect application module
          # We check the settings file for included modules
          SETTINGS_FILE=""
          if [ -f "$ROOT_DIR/settings.gradle.kts" ]; then
            SETTINGS_FILE="$ROOT_DIR/settings.gradle.kts"
          else
            SETTINGS_FILE="$ROOT_DIR/settings.gradle"
          fi

          # Find included modules, prefer ":app" or "app"
          APP_MODULE=""
          if grep -q "include(\":app\")" "$SETTINGS_FILE" || grep -q "include ':app'" "$SETTINGS_FILE" || grep -q "include(\"app\")" "$SETTINGS_FILE"; then
            APP_MODULE="app"
          else
            # Fallback: search for directories containing build.gradle(.kts)
            for d in "$ROOT_DIR"/*/; do
              if [ -f "${d}build.gradle.kts" ] || [ -f "${d}build.gradle" ]; then
                MOD=$(basename "$d")
                if [ "$MOD" != "gradle" ]; then
                  APP_MODULE="$MOD"
                  break
                fi
              fi
            done
          fi

          if [ -z "$APP_MODULE" ]; then
            echo "::error::No application module detected!"
            exit 1
          fi

          echo "Detected application module: $APP_MODULE"
          echo "app_module=$APP_MODULE" >> $GITHUB_OUTPUT

      - name: Cache cleanup (Remove stale project-level Gradle and application build caches)
        working-directory: ${{ steps.detect-project.outputs.project_root }}
        run: |
          echo "Cleaning up safe project caches and build outputs..."
          rm -rf .gradle
          rm -rf ${{ steps.detect-project.outputs.app_module }}/build

      - name: Generate debug keystore if missing
        working-directory: ${{ steps.detect-project.outputs.project_root }}
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already exists."
          fi

      - name: Grant Gradle wrapper execution permission
        working-directory: ${{ steps.detect-project.outputs.project_root }}
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: ${{ steps.detect-project.outputs.project_root }}
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify and Locate APK
        id: locate-apk
        working-directory: ${{ steps.detect-project.outputs.project_root }}
        run: |
          echo "Searching for generated APK files..."
          APK_PATH=$(find ${{ steps.detect-project.outputs.app_module }}/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            # Search broadly in build/outputs/apk
            APK_PATH=$(find ${{ steps.detect-project.outputs.app_module }}/build/ -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::No valid APK file generated or found!"
            exit 1
          fi

          echo "Found APK at: $APK_PATH"
          echo "apk_path=${{ steps.detect-project.outputs.project_root }}/$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-debug-apk
          path: ${{ steps.locate-apk.outputs.apk_path }}
          if-no-files-found: error
